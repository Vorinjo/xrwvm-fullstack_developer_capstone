<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Best Cars Dealerships</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <script>
    const logout = async (event) => {
      if (event) {
        event.preventDefault();
      }
      const response = await fetch(
        window.location.origin + "/djangoapp/logout",
        { method: "GET" }
      );
      if (response.ok) {
        const username = sessionStorage.getItem("username");
        sessionStorage.clear();
        alert("Logging out " + username + "...");
        window.location.href = "/";
      } else {
        alert("The user could not be logged out.");
      }
    };

    const checkSession = () => {
      const currentUser = sessionStorage.getItem("username");
      const panel = document.getElementById("loginlogout");
      if (currentUser) {
        panel.innerHTML =
          '<strong class="homepage_links">' + currentUser + '</strong>' +
          '<a class="homepage_links" onclick="logout(event)" href="/">Logout</a>';
      } else {
        panel.innerHTML =
          '<a class="homepage_links" href="/login/">Login</a>' +
          '<a class="homepage_links" href="/register/">Register</a>';
      }
    };
  </script>
</head>
<body onload="checkSession()">
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: darkturquoise; min-height: 1in;">
    <div class="container-fluid">
      <h2 style="padding-right: 5%;">Best Cars</h2>
      <div class="collapse navbar-collapse show" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about/">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact/">Contact Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/dealers/">Dealers</a></li>
        </ul>
        <div class="navbar-text"><div class="loginlink" id="loginlogout"></div></div>
      </div>
    </div>
  </nav>

  <main class="home-page">
    <section class="home-card">
      <img src="/static/car_dealership.jpg" alt="Best Cars dealership showroom">
      <div class="banner">
        <p class="kicker">Domestic and imported vehicles</p>
        <h1>Welcome to Best Cars Dealerships</h1>
        <p>Find a trusted branch, compare customer experiences, and share your own review.</p>
        <a href="/dealers/" class="btn home-cta">View Dealerships</a>
      </div>
    </section>
  </main>
</body>
</html>
